[supervisord]
nodaemon=true

[program:gunicorn]
command=gunicorn backend.wsgi --bind 0.0.0.0:8000 --workers 2 --log-level=debug
user=www-data # Ejecuta Gunicorn como el usuario www-data
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
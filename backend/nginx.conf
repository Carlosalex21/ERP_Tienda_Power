server {
    listen 80;
    server_name api.powerexcelencia.es;
    client_max_body_size 10M;

    # Logging (opcional pero recomendado para debug/monitoreo)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Servir archivos estáticos
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Servir archivos media (imágenes, uploads)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options nosniff always;
    }

    # Proxy para la API (Django)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Seguridad para el API
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy no-referrer-when-downgrade always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=()" always;
    }

    # Activa gzip para performance
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/font-woff2;
}

name: CI

# Corre en cada push y pull request: verifica que el proyecto arranca, que no
# falten migraciones y que pasen las pruebas -- antes de que algo llegue a producción.
on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/erp_ci
      SECRET_KEY: clave-solo-para-ci-no-es-secreta
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver,.localhost"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisión de configuración de Django
        run: python manage.py check

      - name: Migraciones al día (no falta ningún makemigrations)
        run: python manage.py makemigrations --check --dry-run

      - name: Pruebas
        run: python manage.py test --noinput --parallel 2
